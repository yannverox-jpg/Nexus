services:
  - type: web
    name: nexus-os
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NEXUS_OPERATIONAL_DB_PATH
        value: /tmp/nexus_operational.db
