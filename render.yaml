services:
  - type: web
    name: nexus-os
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn nexus_services.nexus_api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NEXUS_OPERATIONAL_DB_PATH
        value: /tmp/nexus_operational.db
