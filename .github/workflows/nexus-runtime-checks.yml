name: Nexus runtime safety checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q nexus_services
      - name: Run runtime and browser safety tests
        run: >-
          python -m unittest -v
          nexus_services.test_browser_safety
          nexus_services.test_runtime_contracts
          nexus_services.test_operational_journal
          nexus_services.test_operational_dashboard\n          nexus_services.test_multi_agent_orchestrator
