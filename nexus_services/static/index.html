<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Runtime Status</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    main { max-width: 760px; margin: 8vh auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; }
    h1 { color: #38bdf8; }
    .state { font-weight: 700; }
    .muted { color: #94a3b8; }
    code { color: #7dd3fc; }
  </style>
</head>
<body>
  <main>
    <h1>Nexus · État du runtime</h1>
    <p>Cette page affiche uniquement l'état de disponibilité de l'API. Elle ne lit aucun compte de courtier et ne déclenche aucune opération financière.</p>
    <p>État : <span class="state" id="status">Vérification…</span></p>
    <p class="muted" id="details">Aucune donnée de compte ni position de trading n'est collectée par cette page.</p>
    <p class="muted">Source : <code>/health</code></p>
  </main>
  <script>
    async function refreshHealth() {
      const status = document.getElementById('status');
      const details = document.getElementById('details');
      try {
        const response = await fetch('/health', { cache: 'no-store' });
        const data = await response.json();
        if (!response.ok || data.status !== 'online') throw new Error('API indisponible');
        status.textContent = 'API en ligne';
        details.textContent = 'Runtime : ' + data.department + ' · Version : ' + data.version;
      } catch (_) {
        status.textContent = 'API indisponible';
        details.textContent = 'Impossible de confirmer la disponibilité du runtime.';
      }
    }
    refreshHealth();
    setInterval(refreshHealth, 15000);
  </script>
</body>
</html>
